<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honeypot // Intrusion Classifier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e14;
    --panel:#10151f;
    --panel-2:#141a26;
    --border:#1f2733;
    --border-strong:#2a3444;
    --text:#c8d1de;
    --text-dim:#5c6b7f;
    --text-bright:#eef2f7;
    --green:#3ecf8e;
    --green-dim:#1a4a3a;
    --amber:#f5a623;
    --amber-dim:#4a3a10;
    --red:#ff5d5d;
    --red-dim:#4a1c1c;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--mono);
    min-height:100vh;
    padding:24px;
  }
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding-bottom:16px;
    margin-bottom:20px;
    border-bottom:1px solid var(--border);
  }
  header .title{
    font-family:var(--sans);
    font-weight:600;
    font-size:18px;
    color:var(--text-bright);
    display:flex;
    align-items:center;
    gap:10px;
  }
  header .title .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--green);
    box-shadow:0 0 8px var(--green);
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;}
    50%{opacity:.4;}
  }
  header .status{
    font-size:12px;
    color:var(--text-dim);
    display:flex;
    gap:16px;
  }
  header .status span.ok{color:var(--green);}
  header .status span.bad{color:var(--red);}

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
  }
  @media (max-width:900px){
    .grid{grid-template-columns:1fr;}
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:6px;
    padding:20px;
    position:relative;
    overflow:hidden;
  }
  .panel-label{
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

  .field-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:10px;
  }
  .field{display:flex;flex-direction:column;gap:4px;}
  .field.full{grid-column:1/-1;}
  .field label{
    font-size:10px;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:.05em;
  }
  .field input, .field select{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text-bright);
    font-family:var(--mono);
    font-size:13px;
    padding:7px 9px;
    border-radius:4px;
    outline:none;
    transition:border-color .15s;
  }
  .field input:focus, .field select:focus{
    border-color:var(--green);
  }
  .field input::placeholder{color:var(--text-dim);}

  .preset-row{
    display:flex;
    gap:6px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .preset-btn{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text-dim);
    font-family:var(--mono);
    font-size:11px;
    padding:5px 10px;
    border-radius:4px;
    cursor:pointer;
    transition:all .15s;
  }
  .preset-btn:hover{
    border-color:var(--border-strong);
    color:var(--text);
  }

  .submit-row{
    display:flex;
    gap:10px;
    margin-top:16px;
    align-items:center;
  }
  .model-select{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--mono);
    font-size:12px;
    padding:9px 10px;
    border-radius:4px;
  }
  .classify-btn{
    flex:1;
    background:var(--green);
    color:#06140f;
    font-family:var(--mono);
    font-weight:700;
    font-size:13px;
    letter-spacing:.03em;
    border:none;
    padding:11px 16px;
    border-radius:4px;
    cursor:pointer;
    transition:filter .15s;
  }
  .classify-btn:hover{filter:brightness(1.1);}
  .classify-btn:disabled{opacity:.5;cursor:wait;}

  /* Scan sweep */
  .scan-sweep{
    position:absolute;
    top:0; left:-100%;
    width:60%; height:100%;
    background:linear-gradient(90deg, transparent, rgba(62,207,142,.12), transparent);
    pointer-events:none;
    transition:none;
  }
  .scan-sweep.active{
    animation:sweep 1.1s ease-in-out;
  }
  @keyframes sweep{
    0%{left:-60%;}
    100%{left:120%;}
  }

  /* Verdict panel */
  .verdict-empty{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:220px;
    color:var(--text-dim);
    font-size:12px;
    gap:8px;
  }
  .verdict-empty .icon{font-size:28px;opacity:.3;}

  .verdict-body{display:none;}
  .verdict-body.show{display:block;}

  .verdict-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 14px;
    border-radius:4px;
    font-size:16px;
    font-weight:700;
    letter-spacing:.02em;
    margin-bottom:14px;
    border:1px solid transparent;
  }
  .verdict-badge.normal{background:var(--green-dim);color:var(--green);border-color:var(--green);}
  .verdict-badge.scan{background:var(--amber-dim);color:var(--amber);border-color:var(--amber);}
  .verdict-badge.attack{background:var(--red-dim);color:var(--red);border-color:var(--red);}

  .binary-line{
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:18px;
  }
  .binary-line .val{font-weight:700;}
  .binary-line .val.normal{color:var(--green);}
  .binary-line .val.attack{color:var(--red);}

  .conf-row{margin-bottom:14px;}
  .conf-label{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:var(--text-dim);
    margin-bottom:5px;
  }
  .conf-label .pct{color:var(--text-bright);font-weight:700;}
  .conf-track{
    height:6px;
    background:var(--panel-2);
    border-radius:3px;
    overflow:hidden;
  }
  .conf-fill{
    height:100%;
    border-radius:3px;
    width:0%;
    transition:width .6s ease-out;
  }
  .conf-fill.normal{background:var(--green);}
  .conf-fill.scan{background:var(--amber);}
  .conf-fill.attack{background:var(--red);}

  .meta-row{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:var(--text-dim);
    padding-top:14px;
    border-top:1px solid var(--border);
    margin-top:14px;
  }

  /* Log */
  .log-panel{grid-column:1/-1;margin-top:20px;}
  .log-entries{
    max-height:220px;
    overflow-y:auto;
    display:flex;
    flex-direction:column-reverse;
    gap:0;
  }
  .log-entry{
    display:grid;
    grid-template-columns:70px 90px 1fr 90px 60px;
    gap:12px;
    font-size:12px;
    padding:8px 4px;
    border-bottom:1px solid var(--border);
    align-items:center;
  }
  .log-entry .t{color:var(--text-dim);}
  .log-entry .verdict-tag{
    font-weight:700;
    padding:2px 6px;
    border-radius:3px;
    font-size:10px;
    text-transform:uppercase;
    text-align:center;
    width:fit-content;
  }
  .log-entry .verdict-tag.normal{background:var(--green-dim);color:var(--green);}
  .log-entry .verdict-tag.scan{background:var(--amber-dim);color:var(--amber);}
  .log-entry .verdict-tag.attack{background:var(--red-dim);color:var(--red);}
  .log-entry .ip{color:var(--text);}
  .log-entry .conf{color:var(--text-dim);text-align:right;}
  .log-empty{
    font-size:12px;
    color:var(--text-dim);
    padding:20px 0;
    text-align:center;
  }

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-track{background:var(--panel);}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px;}
</style>
</head>
<body>

<header>
  <div class="title"><span class="dot"></span> honeypot // intrusion classifier</div>
  <div class="status">
    <span id="apiStatus">checking api...</span>
  </div>
</header>

<div class="grid">

  <!-- LEFT: packet crafting -->
  <div class="panel">
    <div class="panel-label">craft packet</div>

    <div class="preset-row">
      <button class="preset-btn" data-preset="brute">brute force</button>
      <button class="preset-btn" data-preset="scan">automated scan</button>
      <button class="preset-btn" data-preset="recon">web recon</button>
      <button class="preset-btn" data-preset="normal">normal</button>
    </div>

    <div class="field-row">
      <div class="field">
        <label>src ip</label>
        <input id="src_ip" value="185.220.101.45">
      </div>
      <div class="field">
        <label>protocol</label>
        <select id="protocol">
          <option>SSH</option>
          <option>HTTP</option>
          <option>TCP</option>
          <option>TLS</option>
        </select>
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>dst port</label>
        <input id="dst_port" type="number" value="2222">
      </div>
      <div class="field">
        <label>src port</label>
        <input id="src_port" type="number" value="59090">
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>ttl <span style="opacity:.5">(blank=n/a)</span></label>
        <input id="ttl" type="number" placeholder="—">
      </div>
      <div class="field">
        <label>window size <span style="opacity:.5">(blank=n/a)</span></label>
        <input id="window_size" type="number" placeholder="—">
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>tcp flag</label>
        <input id="tcp_flag" placeholder="—">
      </div>
      <div class="field">
        <label>payload size <span style="opacity:.5">(blank=n/a)</span></label>
        <input id="payload_size" type="number" placeholder="—">
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>http method</label>
        <input id="http_method" placeholder="GET">
      </div>
      <div class="field">
        <label>http path</label>
        <input id="http_path" placeholder="/">
      </div>
    </div>

    <div class="field-row">
      <div class="field full">
        <label>user agent</label>
        <input id="user_agent" placeholder="—">
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>ssh client</label>
        <input id="ssh_client" value="SSH-2.0-libssh2_1.11.1">
      </div>
      <div class="field">
        <label>request rate override</label>
        <input id="request_rate_override" type="number" value="1637">
      </div>
    </div>

    <div class="submit-row">
      <select class="model-select" id="modelSelect">
        <option value="gradient_boosting">gradient_boosting</option>
        <option value="random_forest">random_forest</option>
        <option value="xgboost">xgboost</option>
      </select>
      <button class="classify-btn" id="classifyBtn">classify packet</button>
    </div>
  </div>

  <!-- RIGHT: verdict -->
  <div class="panel">
    <div class="scan-sweep" id="sweep"></div>
    <div class="panel-label">
      <span>classification result</span>
      <span id="modelUsedTag" style="opacity:.5"></span>
    </div>

    <div class="verdict-empty" id="verdictEmpty">
      <div class="icon">◎</div>
      <div>awaiting packet submission</div>
    </div>

    <div class="verdict-body" id="verdictBody">
      <div class="verdict-badge" id="verdictBadge">—</div>
      <div class="binary-line">
        binary verdict: <span class="val" id="binaryVal">—</span>
      </div>

      <div class="conf-row">
        <div class="conf-label">
          <span>attack type confidence</span>
          <span class="pct" id="typeConfPct">0%</span>
        </div>
        <div class="conf-track"><div class="conf-fill" id="typeConfFill"></div></div>
      </div>

      <div class="conf-row">
        <div class="conf-label">
          <span>binary confidence</span>
          <span class="pct" id="binConfPct">0%</span>
        </div>
        <div class="conf-track"><div class="conf-fill" id="binConfFill"></div></div>
      </div>

      <div class="meta-row">
        <span id="metaTime">—</span>
        <span id="metaSrc">—</span>
      </div>
    </div>
  </div>

  <!-- LOG -->
  <div class="panel log-panel">
    <div class="panel-label">classification log</div>
    <div class="log-entries" id="logEntries">
      <div class="log-empty">no requests yet</div>
    </div>
  </div>

</div>

<script>
const API_BASE = "http://127.0.0.1:8000";

const PRESETS = {
  brute: {
    src_ip:"185.220.101.45", protocol:"SSH", dst_port:2222, src_port:59090,
    ttl:"", window_size:"", tcp_flag:"", payload_size:"",
    http_method:"", http_path:"", user_agent:"",
    ssh_client:"SSH-2.0-libssh2_1.11.1", request_rate_override:1637
  },
  scan: {
    src_ip:"45.155.204.12", protocol:"TLS", dst_port:443, src_port:44521,
    ttl:"", window_size:"", tcp_flag:"", payload_size:"",
    http_method:"", http_path:"", user_agent:"",
    ssh_client:"", request_rate_override:15
  },
  recon: {
    src_ip:"192.241.220.5", protocol:"HTTP", dst_port:80, src_port:33221,
    ttl:"", window_size:"", tcp_flag:"", payload_size:"",
    http_method:"GET", http_path:"/wp-admin/admin-ajax.php",
    user_agent:"Mozilla/5.0 (compatible; Nmap Scripting Engine)",
    ssh_client:"", request_rate_override:11
  },
  normal: {
    src_ip:"192.168.1.42", protocol:"TCP", dst_port:443, src_port:52344,
    ttl:64, window_size:65535, tcp_flag:"ACK", payload_size:1200,
    http_method:"", http_path:"", user_agent:"",
    ssh_client:"", request_rate_override:2
  }
};

function applyPreset(name){
  const p = PRESETS[name];
  for(const key in p){
    const el = document.getElementById(key);
    if(el) el.value = p[key];
  }
}

document.querySelectorAll('.preset-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> applyPreset(btn.dataset.preset));
});

function numOrNull(id){
  const v = document.getElementById(id).value;
  return v === "" ? null : Number(v);
}
function strOrEmpty(id){
  return document.getElementById(id).value || "";
}

function buildPayload(){
  return {
    src_ip: strOrEmpty('src_ip'),
    dst_port: numOrNull('dst_port'),
    protocol: strOrEmpty('protocol'),
    timestamp: new Date().toISOString(),
    ttl: numOrNull('ttl'),
    window_size: numOrNull('window_size'),
    tcp_flag: strOrEmpty('tcp_flag') || null,
    src_port: numOrNull('src_port'),
    http_method: strOrEmpty('http_method'),
    http_path: strOrEmpty('http_path'),
    user_agent: strOrEmpty('user_agent'),
    ssh_client: strOrEmpty('ssh_client'),
    payload_size: numOrNull('payload_size'),
    request_rate_override: numOrNull('request_rate_override')
  };
}

function severityClass(attackType){
  if(attackType === 'normal') return 'normal';
  if(attackType === 'automated_scan' || attackType === 'web_recon') return 'scan';
  return 'attack';
}

function renderVerdict(result){
  document.getElementById('verdictEmpty').style.display = 'none';
  const body = document.getElementById('verdictBody');
  body.classList.add('show');

  const sev = severityClass(result.attack_type);

  const badge = document.getElementById('verdictBadge');
  badge.textContent = result.attack_type.replace(/_/g,' ').toUpperCase();
  badge.className = 'verdict-badge ' + sev;

  const binVal = document.getElementById('binaryVal');
  binVal.textContent = result.binary_verdict.toUpperCase();
  binVal.className = 'val ' + (result.binary_verdict === 'normal' ? 'normal' : 'attack');

  const typePct = Math.round(result.attack_type_confidence * 100);
  const binPct = Math.round(result.binary_confidence * 100);

  document.getElementById('typeConfPct').textContent = typePct + '%';
  document.getElementById('binConfPct').textContent = binPct + '%';

  const typeFill = document.getElementById('typeConfFill');
  typeFill.className = 'conf-fill ' + sev;
  const binFill = document.getElementById('binConfFill');
  binFill.className = 'conf-fill ' + (result.binary_verdict === 'normal' ? 'normal' : 'attack');

  requestAnimationFrame(()=>{
    typeFill.style.width = typePct + '%';
    binFill.style.width = binPct + '%';
  });

  document.getElementById('modelUsedTag').textContent = result.model_used;
  document.getElementById('metaTime').textContent = new Date().toLocaleTimeString();
  document.getElementById('metaSrc').textContent = document.getElementById('src_ip').value;
}

function pushLog(result){
  const entries = document.getElementById('logEntries');
  const empty = entries.querySelector('.log-empty');
  if(empty) empty.remove();

  const sev = severityClass(result.attack_type);
  const row = document.createElement('div');
  row.className = 'log-entry';
  row.innerHTML = `
    <span class="t">${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})}</span>
    <span class="verdict-tag ${sev}">${result.binary_verdict}</span>
    <span class="ip">${document.getElementById('src_ip').value} → ${result.attack_type.replace(/_/g,' ')}</span>
    <span style="opacity:.6">${result.model_used}</span>
    <span class="conf">${Math.round(result.attack_type_confidence*100)}%</span>
  `;
  entries.appendChild(row);
}

async function classify(){
  const btn = document.getElementById('classifyBtn');
  btn.disabled = true;
  btn.textContent = 'classifying...';

  const sweep = document.getElementById('sweep');
  sweep.classList.remove('active');
  void sweep.offsetWidth;
  sweep.classList.add('active');

  const model = document.getElementById('modelSelect').value;
  const payload = buildPayload();

  try{
    const res = await fetch(`${API_BASE}/classify?model=${model}`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    if(!res.ok){
      const err = await res.text();
      throw new Error(err);
    }
    const data = await res.json();
    setTimeout(()=>{
      renderVerdict(data);
      pushLog(data);
    }, 550);
  }catch(err){
    alert('Classification failed: ' + err.message);
  }finally{
    setTimeout(()=>{
      btn.disabled = false;
      btn.textContent = 'classify packet';
    }, 600);
  }
}

document.getElementById('classifyBtn').addEventListener('click', classify);

async function checkHealth(){
  const statusEl = document.getElementById('apiStatus');
  try{
    const res = await fetch(`${API_BASE}/health`);
    const data = await res.json();
    if(data.status === 'ok'){
      statusEl.innerHTML = '<span class="ok">● api online</span>';
    }else{
      statusEl.innerHTML = '<span class="bad">● api degraded</span>';
    }
  }catch(e){
    statusEl.innerHTML = '<span class="bad">● api unreachable</span>';
  }
}
checkHealth();
setInterval(checkHealth, 15000);
</script>

</body>
</html>
